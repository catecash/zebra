# Restart the private testnet miner state without continued mining.

[network]
network = "CatecashTestnet"
listen_addr = "127.0.0.1:34353"
initial_mainnet_peers = []
initial_testnet_peers = ["127.0.0.1:34354"]
peerset_initial_target_size = 1
max_connections_per_ip = 2
cache_dir = false

[state]
cache_dir = "target/catecash-testnet-miner-state"

[rpc]
listen_addr = "127.0.0.1:34352"
enable_cookie_auth = false
