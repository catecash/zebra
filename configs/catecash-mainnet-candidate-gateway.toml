# Private mainnet candidate wallet gateway validator; mining is disabled.
[network]
network = "CatecashMainnet"
listen_addr = "10.58.1.3:34333"
initial_mainnet_peers = []
initial_testnet_peers = ["10.58.1.1:34333", "10.58.1.2:34333"]
peerset_initial_target_size = 1
max_connections_per_ip = 2
cache_dir = false

[state]
cache_dir = "/var/lib/catecash-mainnet-candidate"

[rpc]
listen_addr = "127.0.0.1:34332"
enable_cookie_auth = true
